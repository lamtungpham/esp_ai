name: Build TP-01 Firmware

on:
  push:
    branches: [ main, tp01-port ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host unit tests
        run: |
          mkdir -p host/build
          gcc -O2 -Wall -Werror -DSTORY_HOST -Icomponents/story_core/include -Icomponents/story_ui/include -Icomponents/story_llm/include -Ihost host/test_arena.c components/story_core/story_arena.c components/story_core/story_mem.c -o host/build/test_arena -lm
          ./host/build/test_arena
          gcc -O2 -Wall -Werror -DSTORY_HOST -Icomponents/story_core/include -Icomponents/story_ui/include -Icomponents/story_llm/include -Ihost host/test_wrap.c components/story_ui/ui_wrap.c -o host/build/test_wrap -lm
          ./host/build/test_wrap
          gcc -O2 -Wall -Werror -DSTORY_HOST -Icomponents/story_core/include -Icomponents/story_ui/include -Icomponents/story_llm/include -Ihost host/test_intent.c components/story_llm/story_intent.c -o host/build/test_intent -lm
          ./host/build/test_intent
          gcc -O2 -Wall -Werror -DSTORY_HOST -Icomponents/board/include -Icomponents/story_core/include -Icomponents/story_ui/include -Icomponents/story_llm/include -Imain -Ihost -Ihost/stubs host/ui_preview.c main/app_ui.c components/story_ui/ui.c components/story_ui/ui_wrap.c components/story_core/story_mem.c -o host/build/ui_preview -lm
          mkdir -p host/build/frames
          ./host/build/ui_preview host/build/frames

  build-esp32s3:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build TP-01 firmware
        run: |
          idf.py set-target esp32s3
          idf.py build
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tp01-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/story.bin
            build/srmodels/srmodels.bin
            build/flasher_args.json
